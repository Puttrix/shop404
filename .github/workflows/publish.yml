name: Publish Docker image to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (with retry)
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          user="$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')"
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "GHCR login attempt ${attempt}/${max_attempts} as ${user}"
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$user" --password-stdin; then
              echo "GHCR login succeeded"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$(( attempt * 8 ))
              echo "Login failed, retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done
          echo "GHCR login failed after ${max_attempts} attempts"
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/puttrix/shop404
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
