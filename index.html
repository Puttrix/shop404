<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MockShop — Demo Ecommerce</title>
    <meta name="description" content="Mock ecommerce & donation site for testing tags and experiments." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Optional: set a GTM ID via meta for earliest load in dev or static hosting
         <meta name="gtm-id" content="GTM-XXXXXXX" /> -->
    <script>
      // Dark mode: apply earliest to avoid FOUC (supports 'system'|'dark'|'light')
      (function(){
        try {
          var root = document.documentElement;
          var pref = localStorage.getItem('theme');
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          var useSystem = (pref !== 'dark' && pref !== 'light');
          var wantDark = pref === 'dark' || (useSystem && mq && mq.matches);
          if (wantDark) root.classList.add('dark'); else root.classList.remove('dark');
          // If following system, respond to system changes
          if (useSystem && mq && mq.addEventListener) {
            mq.addEventListener('change', function(e){
              var p = localStorage.getItem('theme');
              if (p === 'dark' || p === 'light') return; // user override
              if (e.matches) root.classList.add('dark'); else root.classList.remove('dark');
            });
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Google Consent Mode v2: default-denied before any tags load
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      // Enable lightweight console markers locally
      if (typeof window.__DEBUG_ANALYTICS__ === 'undefined') {
        window.__DEBUG_ANALYTICS__ = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
      }
      // Reusable GTM loader (idempotent)
      window.__loadGTM = function(id){
        try {
          if (!id || window.__gtmLoaded) return;
          window.__gtmLoaded = true;
          if (window.__DEBUG_ANALYTICS__) console.info('[GTM] init start', { id, at: new Date().toISOString() });
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          if (window.__DEBUG_ANALYTICS__) console.info('[GTM] gtm.js event pushed', { id, at: new Date().toISOString() });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=' + id;
          document.head.appendChild(s);
          if (window.__DEBUG_ANALYTICS__) console.info('[GTM] script tag appended', { id, src: s.src });
          var ns = document.createElement('noscript');
          ns.innerHTML = '<iframe src="https://www.googletagmanager.com/ns.html?id=' + id + '" height="0" width="0" style="display:none;visibility:hidden"></iframe>';
          (document.body || document.documentElement).appendChild(ns);
        } catch (e) {}
      }
      // Reusable Matomo Tag Manager loader (idempotent)
      window.__loadMTM = function(containerUrl){
        try {
          if (!containerUrl || window.__mtmLoaded) return;
          window.__mtmLoaded = true;
          if (window.__DEBUG_ANALYTICS__) console.info('[MTM] init start', { containerUrl, at: new Date().toISOString() });
          window._mtm = window._mtm || [];
          window._mtm.push({ 'mtm.startTime': new Date().getTime(), event: 'mtm.Start' });
          var s = document.getElementsByTagName('script')[0];
          var g = document.createElement('script');
          g.async = true; g.src = containerUrl; s.parentNode.insertBefore(g, s);
          if (window.__DEBUG_ANALYTICS__) console.info('[MTM] script tag appended', { src: g.src });
        } catch (e) {}
      }
      // Matomo tracker consent: require consent before MTM loads so tracker reads it from the queue
      try {
        window._paq = window._paq || [];
        window._paq.push(['requireConsent']);
      } catch (e) {}
      // If a meta tag is present, load GTM immediately (earliest path)
      try {
        var meta = document.querySelector('meta[name="gtm-id"]');
        if (meta && meta.content) {
          window.__loadGTM(meta.content);
        }
      } catch (e) {}
    </script>
    <script>
      // Simple runtime config loader. The server serves /config.json from env.
      // After load, initialize GTM as early as possible (GTM-first) from runtime config.
      window.__CONFIG__ = {};
      fetch('/config.json').then(r => r.ok ? r.json() : {}).then(cfg => {
        window.__CONFIG__ = cfg || {};
        if (cfg && cfg.GTM_ID) {
          window.__loadGTM(cfg.GTM_ID);
        }
        if (cfg && cfg.MATOMO_TAG_MANAGER_CONTAINER_URL) {
          window.__loadMTM(cfg.MATOMO_TAG_MANAGER_CONTAINER_URL);
        }
      });
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>
      <div style="padding:8px;text-align:center;background:#fee2e2;color:#991b1b">This site works best with JavaScript enabled.</div>
    </noscript>
  </body>
  </html>
