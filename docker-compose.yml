services:
  mockshop:
    build: .
    image: mockshop:latest
    pull_policy: build
    ports:
      # Change the host port by setting PUBLISH_PORT (defaults to 8080)
      - "${PUBLISH_PORT:-8080}:3000"
    environment:
      - PORT=${PORT:-3000}
      # Tag/Experiment configuration (set as needed). Values are substituted from the Stack env vars.
      - GTM_ID=${GTM_ID:-}
      - GA4_ID=${GA4_ID:-}
      - MATOMO_TAG_MANAGER_CONTAINER_URL=${MATOMO_TAG_MANAGER_CONTAINER_URL:-}
      - OPTIMIZELY_WEB_SNIPPET_URL=${OPTIMIZELY_WEB_SNIPPET_URL:-}
      - ODP_SDK_URL=${ODP_SDK_URL:-}
