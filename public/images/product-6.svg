<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="boots" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#eef2ff"/>
  <g transform="translate(120,200)" opacity="0.95">
    <!-- Left boot -->
    <path d="M80,180 L80,80 Q80,40 120,40 L160,40 L160,120 L200,140 L200,180 Z" fill="url(#boots)"/>
    <!-- Right boot -->
    <path d="M260,180 L260,80 Q260,40 300,40 L340,40 L340,120 L380,140 L380,180 Z" fill="url(#boots)"/>
    <!-- Soles -->
    <rect x="70" y="180" width="140" height="16" rx="8" fill="#1f2937" opacity=".3"/>
    <rect x="250" y="180" width="140" height="16" rx="8" fill="#1f2937" opacity=".3"/>
  </g>
</svg>

